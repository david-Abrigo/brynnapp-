<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Brynn: Parlante de Pagos</title>
    <meta name="description" content="Actualiza tu contraseña de acceso para la aplicación Brynn - Parlante de Pagos.">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #17191f;
            --text-color: #e6e8ec;
            --text-muted: #9ba1ad;
            --accent-color: #a6ff00;
            --accent-hover: #b8ff33;
            --border-color: #262933;
            --error-color: #ef4444;
            --success-color: #10b981;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 36px 28px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            text-align: center;
        }
        .logo-icon {
            width: 54px;
            height: 54px;
            background: rgba(166, 255, 0, 0.15);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 16px;
            color: var(--accent-color);
        }
        h1 {
            color: #ffffff;
            font-size: 22px;
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 24px 0;
        }
        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
        }
        .input-wrap {
            position: relative;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #0d0e12;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent-color);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #0f1115;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-submit:disabled {
            background: #4b5563;
            color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        .alert-box {
            display: none;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: left;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .footer-link {
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .footer-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-icon">⚡</div>
    <h1>Nueva Contraseña</h1>
    <p class="subtitle">Ingresa tu nueva contraseña para acceder a <strong>Brynn - Parlante de Pagos</strong></p>

    <div id="alertBox" class="alert-box"></div>

    <form id="resetForm" onsubmit="handleResetPassword(event)">
        <div class="form-group">
            <label for="password">Nueva contraseña</label>
            <div class="input-wrap">
                <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <div class="input-wrap">
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Repite tu contraseña">
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Guardar Nueva Contraseña</button>
    </form>

    <div id="successContent" style="display: none; margin-top: 20px;">
        <div style="font-size: 42px; margin-bottom: 12px;">🎉</div>
        <h2 style="color: var(--accent-color); font-size: 18px; margin-bottom: 8px;">¡Contraseña actualizada!</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Ya puedes abrir la app de <strong>Brynn</strong> en tu teléfono e iniciar sesión con tu nueva contraseña.</p>
        <br>
        <a href="/" style="display: inline-block; padding: 10px 20px; background: rgba(166,255,0,0.15); color: var(--accent-color); text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 14px;">Ir al inicio</a>
    </div>

    <div class="footer-link">
        <a href="/">← Volver al sitio principal</a>
    </div>
</div>

<script>
    // Inicializar cliente Supabase
    const SUPABASE_URL = "https://sljznppbjxfbgzasjnyq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsanpucHBianhmYmd6YXNqbnlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTM1NzQsImV4cCI6MjEwMzk2OTU3NH0.bIH3x2xsPjxgU0hTPWAg4IwFjKnsUW7RtdpnRM1DB1o";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");
    const resetForm = document.getElementById("resetForm");
    const successContent = document.getElementById("successContent");

    function showAlert(msg, isSuccess = false) {
        alertBox.textContent = msg;
        alertBox.className = "alert-box " + (isSuccess ? "alert-success" : "alert-error");
        alertBox.style.display = "block";
    }

    function clearAlert() {
        alertBox.style.display = "none";
        alertBox.textContent = "";
    }

    // Escuchar el evento de recuperación de contraseña de Supabase
    supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === "PASSWORD_RECOVERY") {
            console.log("Sesión de recuperación detectada");
            clearAlert();
        }
    });

    async function handleResetPassword(e) {
        e.preventDefault();
        clearAlert();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password.length < 6) {
            showAlert("La contraseña debe tener al menos 6 caracteres.");
            return;
        }

        if (password !== confirmPassword) {
            showAlert("Las contraseñas no coinciden. Por favor verifica.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Actualizando...";

        try {
            const { data, error } = await supabase.auth.updateUser({
                password: password
            });

            if (error) {
                showAlert(error.message || "Error al restablecer la contraseña. El enlace puede haber caducado.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Guardar Nueva Contraseña";
            } else {
                resetForm.style.display = "none";
                successContent.style.display = "block";
            }
        } catch (err) {
            showAlert("Error de conexión: " + (err.message || "Intenta nuevamente."));
            submitBtn.disabled = false;
            submitBtn.textContent = "Guardar Nueva Contraseña";
        }
    }
</script>

</body>
</html>
